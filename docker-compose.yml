services:
  api:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ECOM_LLM_API_KEY=${ECOM_LLM_API_KEY:-your_api_key_here}
      - ECOM_LLM_BASE_URL=${ECOM_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - ECOM_LLM_MODEL=${ECOM_LLM_MODEL:-qwen-max}
      - ECOM_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:

