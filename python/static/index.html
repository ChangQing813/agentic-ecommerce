<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Commerce · 推荐实验室</title>
<style>body{margin:0;background:#f3f5f8;color:#182438;font:16px system-ui}main{max-width:1100px;margin:auto;padding:40px 24px}small{color:#68768a}h1{font-size:36px;margin-bottom:8px}form,.panel,article{background:white;border:1px solid #dce2eb;border-radius:14px;padding:22px;margin:20px 0}form{display:flex;gap:14px;flex-wrap:wrap;align-items:end}label{display:grid;gap:7px}input{padding:10px;border:1px solid #bbc5d3;border-radius:7px}button{background:#2154cf;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{margin:0}article h3{min-height:48px}.price{font-size:25px;color:#2154cf}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #eee}#message{white-space:pre-wrap}footer{margin-top:30px;color:#68768a}</style>
<main><small>AGENT COMMERCE / 多 Agent 推荐实验室</small><h1>发现适合你的商品</h1><p>浏览推荐、记录点击，观察画像与 Agent 执行结果。当前使用示例商品。</p>
<form id="form"><label>用户 ID<input id="user" value="demo-user" required maxlength="128"></label><label>推荐数量<input id="count" type="number" value="5" min="1" max="50" required></label><label>服务访问密钥（可选）<input id="key" type="password" autocomplete="off" placeholder="X-API-Key，非模型密钥"></label><button id="submit">获取推荐</button></form>
<p id="message" role="status" aria-live="polite">准备就绪。首次文案可能使用模板，后台完成后再次获取可命中缓存。</p><div class="grid" id="products"></div>
<section class="panel"><h2>Agent 执行记录</h2><div style="overflow:auto"><table><thead><tr><th>节点</th><th>状态</th><th>耗时</th><th>模型尝试</th><th>说明</th></tr></thead><tbody id="agents"></tbody></table></div></section><footer>点击仅记录测试行为；推荐不构成购买承诺，库存以实际订单校验为准。</footer></main>
<script>
const el=id=>document.getElementById(id);let currentUser='';
async function api(path,data){const headers={'Content-Type':'application/json'};if(el('key').value)headers['X-API-Key']=el('key').value;const r=await fetch(path,{method:'POST',headers,body:JSON.stringify(data)});const body=await r.json();if(!r.ok)throw Error(`HTTP ${r.status}: ${JSON.stringify(body.detail)}`);return body;}
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}
el('form').addEventListener('submit',async e=>{e.preventDefault();el('submit').disabled=true;el('message').textContent='Agent 正在生成推荐…';try{const user=el('user').value;const r=await api('/api/v1/recommend',{user_id:user,scene:'homepage',num_items:Number(el('count').value)});currentUser=user;el('products').replaceChildren();for(const p of r.products){const card=node('article','');card.append(node('small',p.category),node('h3',p.name));const price=node('p',`¥${p.price}`);price.className='price';card.append(price,node('p',r.marketing_copies.find(c=>c.product_id===p.product_id)?.copy||''));const b=node('button','感兴趣 · 记录点击');b.type='button';b.onclick=async()=>{b.disabled=true;try{await api('/api/v1/behaviors',{event_id:crypto.randomUUID(),user_id:user,behavior_type:'click',item_id:p.product_id,occurred_at:new Date().toISOString()});b.textContent='已记录，下次推荐将参考此行为';}catch(e){el('message').textContent=e.message;b.disabled=false;}};card.append(b);el('products').append(card);}el('agents').replaceChildren();for(const [name,a] of Object.entries(r.agent_results)){const row=node('tr','');for(const v of [name,a.status,`${a.latency_ms.toFixed(1)} ms`,a.attempts,a.error||a.data.decision||'完成'])row.append(node('td',String(v)));el('agents').append(row);}el('message').textContent=`请求 ${r.request_id} · ${(r.total_latency_ms/1000).toFixed(2)} 秒 · ${r.degraded?'包含模板或降级结果':'全部成功'}${r.products.length?'':' · 无可售商品'}`;}catch(e){el('message').textContent=e.message;}finally{el('submit').disabled=false;}});
</script></html>
