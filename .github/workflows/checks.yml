name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r python/requirements.txt
      - run: python -m unittest discover -s python/tests -t python
      - run: python python/tests/test_ab_test.py
      - run: python python/scripts/evaluate.py
      - run: docker compose config --quiet
      - run: docker build -t recommendation-ci python
